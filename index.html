<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Account IA</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; transition: 1s; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 320px; }
        .btn { background: #e74c3c; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .loader { display: none; border: 6px solid #f3f3f3; border-top: 6px solid #333; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 20px; font-weight: bold; font-size: 18px; color: #333; }
    </style>
</head>
<body id="bg" style="background-color: #e74c3c;"> <div class="container">
    <div class="card">
        <h1 id="titulo">New Account</h1>
        <p id="sub">A IA vai criar sua conta agora</p>
        
        <div id="loader" class="loader"></div>
        
        <button id="main-btn" class="btn" onclick="processarIA()">CRIAR CONTA AUTOMÁTICO</button>
        
        <div id="status">Status: Aguardando...</div>
    </div>
</div>

<script>
function processarIA() {
    const bg = document.getElementById('bg');
    const btn = document.getElementById('main-btn');
    const status = document.getElementById('status');
    const loader = document.getElementById('loader');
    const titulo = document.getElementById('titulo');

    // ETAPA 1: VERMELHO (Início / Verificação)
    btn.style.display = 'none';
    loader.style.display = 'block';
    status.innerText = "Etapa 1: Validando Email...";

    // ETAPA 2: AMARELO (Processando no Google)
    setTimeout(() => {
        bg.style.backgroundColor = '#f1c40f'; // Amarelo
        status.innerText = "Etapa 2: IA Criando conta no Google...";
    }, 2500);

    // ETAPA 3: VERDE (Sucesso Total)
    setTimeout(() => {
        bg.style.backgroundColor = '#2ecc71'; // Verde
        loader.style.display = 'none';
        titulo.innerText = "Conta Ativa! ✅";
        status.innerHTML = "Etapa 3: Sua conta foi adicionada!<br><br><small>Clique abaixo para gerenciar</small>";
        
        let link = document.createElement("button");
        link.innerText = "VER MINHA NOVA CONTA";
        link.style = "margin-top:15px; padding:10px; cursor:pointer; border-radius:10px; border:none; width:100%; background:#333; color:white;";
        status.appendChild(link);
    }, 6000);
}
</script>

</body>
</html> 
 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>New Account AI</title>
    <style>
        body { margin: 0; transition: 1.5s; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #e74c3c; color: white; }
        .box { background: white; color: #333; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 350px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: #333; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; }
        .loading { display: none; margin: 20px auto; width: 40px; height: 40px; border: 5px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <h1 id="txt-titulo">New Account AI</h1>
    <div id="form-area">
        <p>Preencha os dados da nova conta:</p>
        <input type="email" id="email" placeholder="Seu e-mail Google" required>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
        <button id="btn" onclick="criarConta()">CRIAR CONTA AGORA</button>
    </div>
    
    <div id="loader" class="loading"></div>
    <p id="txt-status"></p>
</div>

<script>
function criarConta() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const form = document.getElementById('form-area');
    const status = document.getElementById('txt-status');
    const loader = document.getElementById('loader');
    const body = document.body;

    if(email === "" || senha === "") {
        alert("Por favor, preencha o e-mail e a senha!");
        return;
    }

    // Esconde o formulário e mostra o carregamento
    form.style.display = 'none';
    loader.style.display = 'block';

    // ETAPA 1: Amarelo (Processando)
    body.style.backgroundColor = "#f1c40f"; 
    status.innerText = "🤖 IA: Conectando aos servidores do Google...";
    
    setTimeout(() => {
        status.innerText = "⚙️ IA: Validando credenciais para " + email + "...";
    }, 2500);

    // ETAPA 2: Verde (Sucesso)
    setTimeout(() => {
        body.style.backgroundColor = "#2ecc71"; 
        loader.style.display = 'none';
        document.getElementById('txt-titulo').innerText = "Sucesso! ✅";
        status.innerHTML = "<b>Conta criada com sucesso!</b><br>O usuário " + email + " agora está ativo.";
        
        // Botão para recarregar ou ir para o Google
        let btnFinal = document.createElement("button");
        btnFinal.innerText = "ACESSAR PAINEL";
        btnFinal.onclick = () => window.location.href = "https://accounts.google.com";
        status.appendChild(btnFinal);
    }, 6000);
}
</script>

</body>
</html>
