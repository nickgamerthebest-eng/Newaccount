<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>New Account AI</title>
    <style>
        body { margin: 0; transition: 1.5s; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #e74c3c; color: white; }
        .box { background: white; color: #333; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 350px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: #333; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; }
        .loading { display: none; margin: 20px auto; width: 40px; height: 40px; border: 5px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <h1 id="txt-titulo">New Account AI</h1>
    <div id="form-area">
        <p>Preencha os dados da nova conta:</p>
        <input type="email" id="email" placeholder="Seu e-mail Google" required>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
        <button id="btn" onclick="criarConta()">CRIAR CONTA AGORA</button>
    </div>
    
    <div id="loader" class="loading"></div>
    <p id="txt-status"></p>
</div>

<script>
function criarConta() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const form = document.getElementById('form-area');
    const status = document.getElementById('txt-status');
    const loader = document.getElementById('loader');
    const body = document.body;

    if(email === "" || senha === "") {
        alert("Por favor, preencha o e-mail e a senha!");
        return;
    }

    // Esconde o formulário e mostra o carregamento
    form.style.display = 'none';
    loader.style.display = 'block';

    // ETAPA 1: Amarelo (Processando)
    body.style.backgroundColor = "#f1c40f"; 
    status.innerText = "🤖 IA: Conectando aos servidores do Google...";
    
    setTimeout(() => {
        status.innerText = "⚙️ IA: Validando credenciais para " + email + "...";
    }, 2500);

    // ETAPA 2: Verde (Sucesso)
    setTimeout(() => {
        body.style.backgroundColor = "#2ecc71"; 
        loader.style.display = 'none';
        document.getElementById('txt-titulo').innerText = "Sucesso! ✅";
        status.innerHTML = "<b>Conta criada com sucesso!</b><br>O usuário " + email + " agora está ativo.";
        
        // Botão para recarregar ou ir para o Google
        let btnFinal = document.createElement("button");
        btnFinal.innerText = "ACESSAR PAINEL";
        btnFinal.onclick = () => window.location.href = "https://accounts.google.com";
        status.appendChild(btnFinal);
    }, 6000);
}
</script>

</body>
</html>
